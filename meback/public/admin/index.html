<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Username or Email</label>
                    <input type="text" id="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600">
                    Login
                </button>
            </form>
            <div id="loginError" class="mt-4 text-red-500 text-sm hidden"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <h1 class="text-2xl font-bold text-gray-900">Portfolio Admin</h1>
                    <div class="flex items-center space-x-4">
                        <span id="adminName" class="text-gray-700"></span>
                        <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex">
            <!-- Sidebar -->
            <nav class="bg-gray-800 text-white w-64 min-h-screen">
                <div class="p-4">
                    <ul class="space-y-2">
                        <li><a href="#" onclick="showSection('dashboard')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
                        </a></li>
                        <li><a href="#" onclick="showSection('about')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-user mr-2"></i> About
                        </a></li>
                        <li><a href="#" onclick="showSection('experience')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-briefcase mr-2"></i> Experience
                        </a></li>
                        <li><a href="#" onclick="showSection('skills')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-cogs mr-2"></i> Skills
                        </a></li>
                        <li><a href="#" onclick="showSection('projects')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-project-diagram mr-2"></i> Projects
                        </a></li>
                        <li><a href="#" onclick="showSection('blog')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-blog mr-2"></i> Blog
                        </a></li>
                        <li><a href="#" onclick="showSection('contact')" class="nav-link block py-2 px-4 rounded hover:bg-gray-700">
                            <i class="fas fa-envelope mr-2"></i> Contact
                        </a></li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="flex-1 p-6">
                <!-- Dashboard Section -->
                <div id="dashboardSection" class="section">
                    <h2 class="text-3xl font-bold mb-6">Dashboard</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="statsGrid">
                        <!-- Stats cards will be populated here -->
                    </div>
                </div>

                <!-- About Section -->
                <div id="aboutSection" class="section hidden">
                    <h2 class="text-3xl font-bold mb-6">About Information</h2>
                    <form id="aboutForm" class="bg-white p-6 rounded-lg shadow">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                <input type="text" name="name" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                                <input type="text" name="title" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
                                <textarea name="bio" rows="4" class="w-full px-3 py-2 border rounded-lg"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                                <input type="text" name="location" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Avatar URL</label>
                                <input type="text" name="avatar" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                        </div>
                        <button type="submit" class="mt-4 bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                            Update About
                        </button>
                    </form>
                </div>

                <!-- Experience Section -->
                <div id="experienceSection" class="section hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold">Experience</h2>
                        <button onclick="showAddExperienceModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                            <i class="fas fa-plus mr-2"></i> Add Experience
                        </button>
                    </div>
                    <div id="experienceList" class="space-y-4">
                        <!-- Experience items will be populated here -->
                    </div>
                </div>

                <!-- Skills Section -->
                <div id="skillsSection" class="section hidden">
                    <h2 class="text-3xl font-bold mb-6">Skills</h2>
                    <div id="skillsList" class="space-y-4">
                        <!-- Skills will be populated here -->
                    </div>
                </div>

                <!-- Projects Section -->
                <div id="projectsSection" class="section hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold">Projects</h2>
                        <button onclick="showAddProjectModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                            <i class="fas fa-plus mr-2"></i> Add Project
                        </button>
                    </div>
                    <div id="projectsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Projects will be populated here -->
                    </div>
                </div>

                <!-- Blog Section -->
                <div id="blogSection" class="section hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold">Blog Posts</h2>
                        <button onclick="showAddBlogModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                            <i class="fas fa-plus mr-2"></i> Add Post
                        </button>
                    </div>
                    <div id="blogList" class="space-y-4">
                        <!-- Blog posts will be populated here -->
                    </div>
                </div>

                <!-- Contact Section -->
                <div id="contactSection" class="section hidden">
                    <h2 class="text-3xl font-bold mb-6">Contact Information</h2>
                    <form id="contactForm" class="bg-white p-6 rounded-lg shadow">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" name="email" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                                <input type="text" name="phone" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                                <input type="text" name="location" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                        </div>
                        <button type="submit" class="mt-4 bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                            Update Contact
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-4 rounded-lg">
            <i class="fas fa-spinner fa-spin text-2xl text-blue-500"></i>
            <span class="ml-2">Loading...</span>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
